closed_source:
  gpt4o:
    name: "OpenAI GPT-4o"
    provider: "openai"
    params_b: null         # undisclosed
    context_window: 128000
    strengths: ["multimodal", "reasoning", "coding", "general purpose"]
    use_cases: ["enterprise", "coding assistant", "vision tasks", "agents"]
    pricing:
      input_per_1m_tokens: 2.50
      output_per_1m_tokens: 10.00
      batch_input_per_1m_tokens: 1.25
      batch_output_per_1m_tokens: 5.00
    vision_capable: true
    image_pricing:
      # OpenAI tile-based: 85 base tokens + 170 per 512×512 tile. Images rescaled to fit
      # 2048×2048, then shortest side to 768px before tiling. 1024×1024 → 4 tiles = 765 tokens.
      # Low detail is a fixed 85 tokens regardless of resolution.
      # VERIFY: https://platform.openai.com/docs/guides/vision — these numbers change with model updates.
      low_detail_tokens: 85
      high_detail_tokens_1024px: 765
      pricing_model: "tile_based"
    last_updated: "2026-06-01"

  gpt4o_mini:
    name: "OpenAI GPT-4o Mini"
    provider: "openai"
    params_b: null
    context_window: 128000
    strengths: ["low cost", "fast", "sufficient for most tasks"]
    use_cases: ["high-volume apps", "classification", "simple chat"]
    pricing:
      input_per_1m_tokens: 0.15
      output_per_1m_tokens: 0.60
      batch_input_per_1m_tokens: 0.075
      batch_output_per_1m_tokens: 0.30
    vision_capable: true
    image_pricing:
      # Same tile formula as GPT-4o; per-token rate is cheaper.
      # VERIFY: https://platform.openai.com/docs/guides/vision
      low_detail_tokens: 85
      high_detail_tokens_1024px: 765
      pricing_model: "tile_based"
    last_updated: "2026-06-01"

