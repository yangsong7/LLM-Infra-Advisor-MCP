# Model registry: open-source and closed-source models
# params_b: billions of parameters
# min_vram_inference_gb: minimum VRAM for inference at fp16 (no quantization)
# min_vram_inference_int4_gb: minimum VRAM with 4-bit quantization
# flops_per_token: approximate FLOPs per forward pass token
# context_window: max tokens
# last_updated: YYYY-MM-DD

