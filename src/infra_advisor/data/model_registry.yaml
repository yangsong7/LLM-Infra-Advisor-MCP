      output_per_1m_tokens: 5.00
      batch_input_per_1m_tokens: 0.50
      batch_output_per_1m_tokens: 2.50
    vision_capable: true
    image_pricing:
      # Anthropic charges image tokens at the same rate as text tokens.
      # Approximate: ~1590 tokens for a 1024×1024 image (based on documented image sizing).
      # VERIFY: https://docs.anthropic.com/en/docs/build-with-claude/vision — Anthropic's formula
      # is 1.5 × (width × height / 750), so 1024×1024 ≈ 1398 tokens.
      high_detail_tokens_1024px: 1398
      pricing_model: "token_based"
    last_updated: "2026-06-01"

  gemini_1_5_pro:
    name: "Google Gemini 1.5 Pro"
    provider: "google"
    params_b: null
