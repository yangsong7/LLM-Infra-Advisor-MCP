# On-prem infrastructure add-ons (per GPU per month)
onprem_overhead:
  power_cost_kwh_usd: 0.12          # average US commercial rate
  pue: 1.4                          # power usage effectiveness (cooling overhead)
  rack_cost_per_gpu_month: 50       # colocation or own datacenter amortized
  networking_per_gpu_month: 30      # InfiniBand / ethernet
  maintenance_labor_per_gpu_month: 40
  hardware_depreciation_years: 4
  software_license_per_gpu_month: 20   # monitoring, security, management tooling
  ml_infra_salary_usd_year: 250000     # US, fully loaded (benefits + overhead)
  # ML-infra staffing tiers: [max_gpus, recommended_fte]. Clusters above the last
  # tier scale at gpu_count / 128 FTE (see _estimate_fte fallback).
  ml_infra_fte_tiers:
    - [8, 0.5]
    - [32, 1.0]
    - [128, 2.0]
    - [512, 4.0]

# Report orchestration policy (not pricing, but tunable planning defaults).
planning:
  default_utilization: 0.70
  # Reference cluster size used to size the TCO comparison by workload scale.
  scale_gpu_counts:
    personal: 1
    startup: 2
    mid_market: 4
    enterprise: 8
